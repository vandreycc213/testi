<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escolha sua cadeira</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Indicador de status de conexão -->
  <div id="connection-banner" class="connection-banner hidden"></div>

  <!-- Modal para informar o nome do usuário -->
  <div id="name-modal" class="modal-overlay">
    <div class="modal-card">
      <h2>Bem-vindo(a) 👋</h2>
      <p>Informe seu nome para escolher uma cadeira.</p>
      <input id="name-input" type="text" maxlength="40" placeholder="Seu nome" autocomplete="off" />
      <button id="name-confirm-btn">Entrar</button>
      <p id="name-error" class="field-error hidden">Digite um nome válido.</p>
    </div>
  </div>

  <main class="app">
    <header class="app-header">
      <h1>Escolha sua cadeira</h1>
      <p class="subtitle">
        Olá, <span id="current-user-name">—</span>! Clique em uma cadeira disponível para reservá-la.
      </p>
    </header>

    <section class="legend">
      <span class="legend-item"><span class="dot dot-green"></span> Disponível</span>
      <span class="legend-item"><span class="dot dot-red"></span> Ocupada</span>
      <span class="legend-item"><span class="dot dot-yellow"></span> Atualizando</span>
    </section>

    <section id="chairs-grid" class="chairs-grid">
      <!-- Cadeiras geradas dinamicamente via JavaScript -->
    </section>

    <section class="my-chair-panel hidden" id="my-chair-panel">
      <p>Você está na <strong id="my-chair-label">—</strong></p>
      <button id="release-btn">Liberar minha cadeira</button>
    </section>
  </main>

  <!-- Área de notificações/toasts -->
  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
